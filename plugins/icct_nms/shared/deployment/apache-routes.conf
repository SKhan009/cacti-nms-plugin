# Apache 2.4: install in conf.d when the Cacti directory uses AllowOverride None.
<Directory "/var/www/html/cacti/plugins/icct_nms">
# Existing bookmarks and cached forms retain their query strings and POST bodies.
# Existing bookmarks and cached forms retain their query strings and POST bodies.
RewriteEngine On
RewriteRule ^$ dashboard/controllers/topology.php [END]
RewriteRule ^topology\.php$ dashboard/controllers/topology.php [END]
RewriteRule ^topology_configuration\.php$ dashboard/topology/controllers/topology_configuration.php [END]
RewriteRule ^inventory\.php$ inventory/controllers/inventory.php [END]
RewriteRule ^device\.php$ inventory/controllers/device.php [END]
RewriteRule ^export\.php$ inventory/controllers/export.php [END]
RewriteRule ^wizard_save\.php$ inventory/controllers/wizard_save.php [END]
RewriteRule ^wizard_templates\.php$ inventory/controllers/wizard_templates.php [END]
RewriteRule ^diagnostics\.php$ inventory/diagnostics/controllers/diagnostics.php [END]
RewriteRule ^protocol\.php$ protocols/shared/controllers/protocol.php [END]
RewriteRule ^syslog\.php$ protocols/syslog/controllers/syslog.php [END]
RewriteRule ^mib_repository\.php$ protocols/snmp/mibs/controllers/mib_repository.php [END]
RewriteRule ^presets\.php$ presets/controllers/presets.php [END]
RewriteRule ^rack_placement\.php$ presets/controllers/rack_placement.php [END]
RewriteRule ^ports\.php$ ports/controllers/ports.php [END]

# Private SSH configuration is read by PHP and the broker, never served as a static asset.
<Files "ssh.config.local.json">
    Require all denied
</Files>
</Directory>

# Working MIB files are private even when .htaccess overrides are disabled.
<Directory "/var/www/html/cacti/plugins/icct_nms/protocols/snmp/mibs/storage">
    Require all denied
</Directory>

# Offline package bundles must never be downloadable from Apache.
<Directory "/var/www/html/cacti/plugins/icct_nms/installation/bundles">
    Require all denied
</Directory>
